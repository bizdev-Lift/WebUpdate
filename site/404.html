<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found | Lift Commerce</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16233F; --teal:#0088B0; --teal-dk:#006786;
  --paper:#fff; --mist:#F5F4F2; --line:#D7D3D3; --body:#444141; --muted:#605D5D;
  --serif:"Source Serif 4",Georgia,serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:2px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;font-family:var(--serif);color:var(--body);
     background:var(--mist);font-size:17px;line-height:1.68;-webkit-font-smoothing:antialiased}
a{color:var(--teal-dk)}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px}

.top{background:var(--paper);border-bottom:1px solid var(--line);padding:18px 24px}
.brand{display:inline-block}
.brand img{display:block;height:46px;width:auto}

main{flex:1;display:flex;align-items:center;justify-content:center;padding:64px 24px}
.box{max-width:560px;text-align:center}
.eyebrow{font-family:var(--mono);font-size:.71rem;font-weight:600;letter-spacing:.16em;
         text-transform:uppercase;color:var(--teal-dk);margin:0 0 .9rem}
h1{font-size:clamp(2rem,3.7vw,3rem);font-weight:600;color:var(--ink);margin:0 0 1rem;
   line-height:1.12;letter-spacing:-.015em}
p{margin:0 0 2rem}
.btn{display:inline-flex;align-items:center;gap:.5rem;font-family:Arial,Helvetica,sans-serif;font-weight:600;font-size:1rem;
     padding:.8rem 1.5rem;border-radius:var(--r);text-decoration:none;color:#fff;
     background:var(--teal);box-shadow:0 4px 14px rgba(0,136,176,.3);
     transition:background .16s,transform .16s}
.btn:hover{background:var(--teal-dk);transform:translateY(-2px)}
.alt{margin-top:1.6rem;font-size:.95rem;color:var(--muted)}

footer{padding:20px 24px;text-align:center;font-size:.85rem;color:var(--muted)}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/" aria-label="Lift Commerce home"><img src="/assets/img/lift-commerce-logo.avif" alt="Lift Commerce" width="251" height="46"></a>
</header>

<main>
  <div class="box">
    <p class="eyebrow">Error 404</p>
    <h1>This page didn't make it to the destination.</h1>
    <p>The link may be out of date, or the page has moved. Everything else is still on the main site.</p>
    <a class="btn" href="/">Back to Lift Commerce &rarr;</a>
    <div class="alt">Looking for something specific? <a href="/contact">Contact us</a> or call <a href="tel:+12036016208">(203) 601-6208</a>.</div>
  </div>
</main>

<footer>&copy; Lift Commerce &middot; 55 Post Road West, Westport, CT 06880</footer>
</body>
</html>
